<body>
    <h1>Hello World!</h1>
    <img src="http://localhost:4000/backend.png">

    <script>

        fetch('http://localhost:4000/api')
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            }

            )
            .then(data => {
                console.log(data);
            })
            .catch(error => {
                console.error('Fetch error:', error)
            })
    </script>
</body>

</html>
